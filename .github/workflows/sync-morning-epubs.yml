name: Sync morning revival EPUBs

on:
  schedule:
    - cron: "17 23 * * 0"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Discover only; do not upload to R2
        required: false
        default: false
        type: boolean

concurrency:
  group: sync-morning-epubs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
      MORNING_CATALOG_URL: ${{ vars.MORNING_CATALOG_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r automation/requirements.txt
      - name: Discover and publish
        run: |
          args=()
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python automation/sync_morning_epubs.py "${args[@]}"
